<mat-card class="post-card">
  <mat-card-header>
    <img
      mat-card-avatar
      [src]="author?.avatarUrl || 'https://i.pravatar.cc/100'"
      [alt]="author?.name || 'Unknown'"
      class="author-avatar"
    />
    <mat-card-title>{{ author?.name || 'Unknown User' }}</mat-card-title>
    <mat-card-subtitle>{{ post.title }}</mat-card-subtitle>
  </mat-card-header>

  @if (post.imageUrl) {
    <img
      mat-card-image
      [src]="post.imageUrl"
      [alt]="post.title"
      class="post-image"
    />
  }

  <mat-card-content>
    <p class="post-content">{{ post.content }}</p>
  </mat-card-content>

  <mat-card-actions class="post-actions">
    <button mat-flat-button class="like-btn" (click)="liked.emit(post.id)">
      <mat-icon>favorite</mat-icon>
      Like ({{ post.likes }})
    </button>

    <button mat-button class="edit-btn" (click)="edited.emit(post)">
      <mat-icon>edit</mat-icon>
      Edit
    </button>

    <button mat-button class="delete-btn" (click)="deleted.emit(post.id)">
      <mat-icon>delete</mat-icon>
      Delete
    </button>
  </mat-card-actions>
</mat-card>
