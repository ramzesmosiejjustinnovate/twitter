<mat-card class="post-card">
  <mat-card-header class="post-card__header">
    <img
      mat-card-avatar
      [src]="post().user?.avatarUrl || 'https://i.pravatar.cc/100'"
      [alt]="post().user?.name"
      class="post-card__avatar"
    />
    <mat-card-title>{{ post().user?.name ?? 'Unknown' }}</mat-card-title>
    <mat-card-subtitle>{{ post().title }}</mat-card-subtitle>
  </mat-card-header>

  @if (post().imageUrl) {
    <img mat-card-image [src]="post().imageUrl" [alt]="post().title" class="post-card__image" />
  }

  <mat-card-content class="post-card__content">
    <p>{{ post().content }}</p>
  </mat-card-content>

  <mat-card-actions class="post-card__actions">
    <button mat-icon-button color="primary" (click)="onLike()" aria-label="Like">
      <mat-icon>favorite</mat-icon>
    </button>
    <span class="post-card__likes">{{ post().likes }}</span>

    <span class="post-card__spacer"></span>

    <button mat-icon-button (click)="onEdit()" aria-label="Edit">
      <mat-icon>edit</mat-icon>
    </button>
    <button mat-icon-button (click)="onDelete()" aria-label="Delete">
      <mat-icon>delete</mat-icon>
    </button>
  </mat-card-actions>
</mat-card>
